spring:

  config:
    import: optional:file:.env[.properties] # Look for a .env to import, its optional so if you dont have one itll be fine.

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop # Automatically builds/clears tables for tests